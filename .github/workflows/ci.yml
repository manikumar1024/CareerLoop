name: CareerLoop AI CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Push Local DB
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Run Automated Test Suite
        run: npm test
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "ci-secret-for-static-analysis"
          NEXTAUTH_URL: "http://localhost:3000"
